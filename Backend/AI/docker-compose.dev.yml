# ATHLASX Compute — LOCAL, ISOLATED dev stack.
#
# This is SEPARATE from the project's real infra/docker-compose.yml. It stands up a
# dedicated Postgres + Redis ONLY for developing/testing this service, on non-default
# host ports (5433 / 6380) so it never collides with the real stack.
#
# Usage:
#   cd Backend/AI
#   export GEMINI_API_KEY=...           # optional; only needed for live calls
#   docker compose -f docker-compose.dev.yml up --build
#
# The `compute` service runs `alembic upgrade head` before starting Uvicorn, so the
# 6 owned tables are created automatically on first boot.

name: athlasx-compute-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: athlasx
      POSTGRES_PASSWORD: athlasx
      POSTGRES_DB: athlasx_compute
    ports:
      - "5433:5432"
    volumes:
      - compute_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athlasx -d athlasx_compute"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  compute:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://athlasx:athlasx@postgres:5432/athlasx_compute
      REDIS_URL: redis://redis:6379/1
      AUTH_JWT_SECRET: dev-only-insecure-secret-change-me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-gemini-3.1-pro-preview}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.5-flash}
      GEMINI_OCR_MODEL: ${GEMINI_OCR_MODEL:-gemini-3.5-flash}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  compute-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://athlasx:athlasx@postgres:5432/athlasx_compute
      REDIS_URL: redis://redis:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-gemini-3.1-pro-preview}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.5-flash}
      GEMINI_OCR_MODEL: ${GEMINI_OCR_MODEL:-gemini-3.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  compute_pgdata:
