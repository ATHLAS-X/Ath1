# Alembic config for the ATHLASX compute service (LOCAL dev DB only).
#
# STANDALONE-BUILD NOTE: at real integration time, per the architecture doc's
# schema-ownership rule, this service must NOT run migrations against the shared
# database (Prisma owns it). See RECONCILIATION_NOTES.md §5. The sqlalchemy.url is
# resolved from app settings in alembic/env.py (not hardcoded here).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
