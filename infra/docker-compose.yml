version: "3.9"

networks:
  internal:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    networks: [internal]
    depends_on: [redis]

  web-worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    networks: [internal]
    depends_on: [redis]

  compute:
    build:
      context: ../apps/compute
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    networks: [internal]
    depends_on: [redis]

  compute-worker:
    build:
      context: ../apps/compute
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    networks: [internal]
    depends_on: [redis]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [internal]
    ports:
      - "80:80"
      - "443:443"
    depends_on: [web, compute]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks: [internal]
    depends_on: [caddy]
