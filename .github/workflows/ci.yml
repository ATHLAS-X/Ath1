name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a stale run for the same branch/PR when new commits land, so
# queued runs don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Provisions the isolated `athlasx_test` Postgres schema this suite
      # runs against (scripts/setup-test-db.mjs) — same schema this
      # session's own local runs use, not a fresh/ephemeral one. See the
      # concurrency note in the plan: two CI runs racing this step against
      # the same shared schema is a known, accepted risk at this repo's
      # current PR cadence, not something this workflow solves.
      - run: npm run test:setup-db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
      # Regression suite: unit + integration + security. Any failure here
      # fails the job and blocks the PR. tests/known-defects/ is deliberately
      # NOT part of it — see the separate job below.
      - run: npm run test:ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

  # tests/known-defects/ holds acknowledged, still-open defects on purpose:
  # each test asserts the behaviour the product documents and is EXPECTED to
  # fail until the defect is fixed. Running it as its own job keeps a known
  # defect visible in the PR checks list without turning genuine regressions
  # (the `test` job above, which has no such override) red-on-arrival.
  # continue-on-error at the job level means a failure here does not fail the
  # workflow run or block merging. Never add it to any other job, and never
  # skip or weaken these assertions to make this job green. It touches no
  # database, so it needs no secrets.
  known-defects:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:known-defects
