<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AthlasX Player Workflow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--g:#22C55E;--gd:#0F2419;--gm:#1A3A28;--bg:#050505;--card:#0C0C0C;--card2:#111111;--border:#1E1E1E;--text:#FFFFFF;--muted:#A1A1AA;--dim:#52525B;--fe:#0A1A2E;--be:#0E1F16;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(34,197,94,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;}
header{position:fixed;top:0;left:0;right:0;height:60px;z-index:100;background:rgba(5,5,5,.92);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;backdrop-filter:blur(12px);}
.logo{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:800;}
.logo-icon{width:32px;height:32px;border-radius:8px;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 20px rgba(34,197,94,.4);}
.logo span{color:var(--g);}
.step-counter{font-size:.8rem;color:var(--muted);}
.step-counter b{color:var(--g);}
.progress-bar{position:fixed;top:60px;left:0;right:0;z-index:99;height:3px;background:var(--border);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gd),var(--g));transition:width .6s cubic-bezier(.4,0,.2,1);}
.timeline{position:fixed;bottom:0;left:0;right:0;height:80px;z-index:100;background:rgba(5,5,5,.95);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0 16px;backdrop-filter:blur(12px);}
.tl-step{display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer;position:relative;}
.tl-step:not(:last-child)::after{content:'';position:absolute;top:14px;left:60%;width:80%;height:1px;background:var(--border);transition:background .4s;z-index:0;}
.tl-step.done::after,.tl-step.active::after{background:var(--g);}
.tl-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:var(--dim);transition:all .3s;z-index:1;position:relative;}
.tl-step.done .tl-dot{background:var(--g);border-color:var(--g);color:#000;}
.tl-step.active .tl-dot{background:var(--gm);border-color:var(--g);color:var(--g);box-shadow:0 0 16px rgba(34,197,94,.5);transform:scale(1.2);}
.tl-label{font-size:.5rem;color:var(--dim);margin-top:4px;text-align:center;max-width:56px;line-height:1.2;}
.tl-step.active .tl-label{color:var(--g);}
.tl-step.done .tl-label{color:var(--muted);}
.stage{position:fixed;top:63px;bottom:80px;left:0;right:0;display:flex;align-items:center;justify-content:center;perspective:1200px;z-index:10;}
.card-wrap{position:relative;width:min(920px,96vw);transform-style:preserve-3d;transition:transform .12s ease;}
.wf-card{width:100%;border-radius:20px;overflow:hidden;border:1px solid var(--border);box-shadow:0 32px 80px rgba(0,0,0,.8),0 0 0 1px rgba(34,197,94,.06);background:var(--card);}
.wf-card.entering{animation:cardIn .5s cubic-bezier(.4,0,.2,1) forwards;}
.wf-card.leaving{animation:cardOut .38s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes cardOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-18px) scale(.98)}}
.card-top{padding:18px 28px 14px;background:linear-gradient(135deg,#0A0A0A,var(--card));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;}
.step-badge{padding:4px 12px;border-radius:20px;background:var(--gm);border:1px solid var(--g);font-size:.65rem;font-weight:700;color:var(--g);letter-spacing:.08em;white-space:nowrap;}
.card-title{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;}
.card-subtitle{font-size:.75rem;color:var(--muted);margin-top:2px;}
.layer-badges{display:flex;gap:8px;margin-left:auto;}
.lbadge{padding:3px 10px;border-radius:12px;font-size:.6rem;font-weight:600;letter-spacing:.05em;}
.lbadge.fe{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#60A5FA;}
.lbadge.be{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--g);}
.panels{display:grid;grid-template-columns:1fr 56px 1fr;min-height:230px;}
.fe-panel{background:linear-gradient(135deg,var(--fe),#060F1E);padding:18px 22px;position:relative;}
.be-panel{background:linear-gradient(135deg,var(--be),#060F10);padding:18px 22px;}
.panel-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;display:flex;align-items:center;gap:6px;margin-bottom:12px;}
.panel-label.fe-l{color:#60A5FA;}.panel-label.be-l{color:var(--g);}
.dot-fe{width:7px;height:7px;border-radius:50%;background:#60A5FA;box-shadow:0 0 8px #60A5FA;}
.dot-be{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);}
.flow-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 0;border-left:1px solid rgba(59,130,246,.12);border-right:1px solid rgba(34,197,94,.12);}
.flow-dot{width:7px;height:7px;border-radius:50%;background:var(--g);animation:flowD 1.4s ease-in-out infinite;opacity:.8;}
.flow-dot:nth-child(2){animation-delay:.32s;}.flow-dot:nth-child(3){animation-delay:.64s;}.flow-dot:nth-child(4){animation-delay:.96s;}
@keyframes flowD{0%{transform:translateY(-8px);opacity:0}40%{opacity:1}100%{transform:translateY(8px);opacity:0}}
.flow-lbl{font-size:.42rem;color:var(--g);writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);letter-spacing:.06em;}
.ui-input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;font-size:.7rem;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:8px;}
.ui-input.active{border-color:rgba(34,197,94,.4);color:var(--text);}
.ui-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;background:var(--g);color:#000;font-size:.68rem;font-weight:700;margin-top:7px;box-shadow:0 0 14px rgba(34,197,94,.3);}
.ui-otp{display:flex;gap:6px;margin-bottom:8px;}
.otp-box{width:30px;height:34px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;}
.otp-box.filled{border-color:var(--g);color:var(--g);background:rgba(34,197,94,.08);}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.role-chip{padding:7px 4px;border-radius:8px;border:1px solid var(--border);background:var(--card2);text-align:center;font-size:.58rem;color:var(--muted);}
.role-chip.sel{border-color:var(--g);background:var(--gm);color:var(--g);font-weight:700;}
.role-chip .em{font-size:.95rem;display:block;margin-bottom:2px;}
.phase-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:.63rem;}
.phase-name{color:var(--muted);width:78px;flex-shrink:0;}
.phase-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
.phase-fill{height:100%;border-radius:3px;}
.phase-val{color:var(--text);font-weight:600;width:34px;text-align:right;font-size:.6rem;}
.mqi-b{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:.53rem;font-weight:700;}
.mqih{background:rgba(34,197,94,.15);color:var(--g);border:1px solid rgba(34,197,94,.3);}
.mqim{background:rgba(245,158,11,.15);color:#F59E0B;border:1px solid rgba(245,158,11,.3);}
.mqil{background:rgba(239,68,68,.15);color:#EF4444;border:1px solid rgba(239,68,68,.3);}
.match-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:6px;font-size:.63rem;border:1px solid var(--border);}
.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.video-box{border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.58rem;color:var(--muted);position:relative;overflow:hidden;}
.angle-lbl{padding:2px 8px;border-radius:10px;background:rgba(34,197,94,.2);color:var(--g);font-size:.53rem;font-weight:600;margin-top:4px;}
.vsrc{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:7px;}
.vsrc.active{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.06);}
.vsrc-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0;}
.vsrc-title{font-size:.67rem;font-weight:600;}.vsrc-sub{font-size:.57rem;color:var(--muted);}
.vsrc-pts{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--g);}
.score-ring{position:relative;width:86px;height:86px;flex-shrink:0;}
.score-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-track{fill:none;stroke:rgba(255,255,255,.06);stroke-width:8;}
.ring-fill{fill:none;stroke:var(--g);stroke-width:8;stroke-linecap:round;stroke-dasharray:251;}
.score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;color:var(--g);}
.score-num span{font-size:.48rem;color:var(--muted);font-weight:400;}
.cat-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.cat-name{font-size:.58rem;color:var(--muted);width:86px;flex-shrink:0;}
.cat-bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.05);}
.cat-fill{height:100%;border-radius:3px;}
.cat-pts{font-size:.56rem;color:var(--text);font-weight:600;width:28px;text-align:right;}
.tier-badge-big{padding:10px 22px;border-radius:24px;font-weight:800;font-size:.78rem;letter-spacing:.04em;margin:6px auto;display:block;width:fit-content;}
.t1{background:rgba(34,197,94,.18);border:2px solid var(--g);color:var(--g);box-shadow:0 0 22px rgba(34,197,94,.25);}
.sf-chip{padding:3px 8px;border-radius:8px;font-size:.53rem;font-weight:600;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:var(--g);}
.scout-filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.p-result{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:var(--gm);border:1px solid rgba(34,197,94,.3);margin-bottom:6px;}
.p-av{width:30px;height:30px;border-radius:7px;background:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:.72rem;flex-shrink:0;}
.p-score{margin-left:auto;font-size:1.1rem;font-weight:800;color:var(--g);}
.notif{border-radius:10px;border:1px solid rgba(34,197,94,.3);background:var(--gm);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;}
.notif-title{font-size:.72rem;font-weight:700;margin-bottom:3px;}
.notif-body{font-size:.63rem;color:var(--muted);line-height:1.5;}
.n-btns{display:flex;gap:8px;margin-top:9px;}
.btn-a{padding:5px 14px;border-radius:8px;background:var(--g);color:#000;font-size:.63rem;font-weight:700;border:none;}
.btn-d{padding:5px 14px;border-radius:8px;background:transparent;color:var(--muted);font-size:.63rem;border:1px solid var(--border);}
.be-step{display:flex;gap:10px;margin-bottom:8px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.025);border:1px solid rgba(34,197,94,.07);}
.be-num{width:20px;height:20px;border-radius:5px;background:var(--gm);border:1px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:.53rem;font-weight:800;color:var(--g);flex-shrink:0;margin-top:1px;}
.be-text{font-size:.63rem;color:var(--muted);line-height:1.5;}
.be-text b{color:var(--text);}
.code-block{background:rgba(0,0,0,.4);border:1px solid rgba(34,197,94,.1);border-radius:8px;padding:9px 11px;font-family:monospace;font-size:.58rem;color:#86EFAC;line-height:1.65;margin-bottom:7px;}
.code-block .k{color:#60A5FA;}.code-block .s{color:#FDE68A;}.code-block .n{color:var(--g);}
.data-row{padding:11px 28px;background:rgba(0,0,0,.3);border-top:1px solid var(--border);display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.data-chip{display:flex;flex-direction:column;gap:2px;}
.data-key{font-size:.48rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;}
.data-val{font-size:.68rem;font-weight:700;color:var(--g);}
.nav-btns{position:fixed;bottom:100px;right:28px;display:flex;gap:10px;z-index:200;}
.nav-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(14,14,14,.9);display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;color:var(--muted);transition:all .2s;backdrop-filter:blur(8px);}
.nav-btn:hover{border-color:var(--g);color:var(--g);}
.nav-btn.prim{background:var(--g);color:#000;border-color:var(--g);box-shadow:0 0 20px rgba(34,197,94,.4);}
.nav-btn.prim:hover{transform:scale(1.08);}
.key-hint{position:fixed;bottom:100px;left:28px;font-size:.58rem;color:var(--dim);display:flex;gap:8px;align-items:center;z-index:200;}
.key-hint kbd{padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:.52rem;}
</style></head><body>
<header>
  <div class="logo"><div class="logo-icon">&#9889;</div>Sport<span>X</span></div>
  <div style="text-align:center"><div style="font-size:.75rem;font-weight:700;">Player Workflow</div><div style="font-size:.58rem;color:var(--muted)">Registration to Discovery</div></div>
  <div class="step-counter">Step <b id="cnum">1</b> of <b>10</b></div>
</header>
<div class="progress-bar"><div class="progress-fill" id="pbar" style="width:10%"></div></div>
<div class="stage" id="stage"><div class="card-wrap" id="cw"><div class="wf-card" id="wfc"></div></div></div>
<div class="timeline" id="tl"></div>
<div class="nav-btns"><div class="nav-btn" id="pb" onclick="go(-1)">&#8592;</div><div class="nav-btn prim" id="nb" onclick="go(1)">&#8594;</div></div>
<div class="key-hint"><kbd>&#8592;</kbd><kbd>&#8594;</kbd> arrow keys</div>
<script>
const S=[
{label:"Register",title:"Player Registration",sub:"Phone OTP · Email · Date of Birth · Age Check",
fe:`<div class="panel-label fe-l"><div class="dot-fe"></div>FRONTEND — Mobile / Web App</div>
<div class="ui-input active"><span>&#128241;</span>&nbsp;+91 &nbsp;98XXXXXXXX</div>
<div class="ui-otp"><div class="otp-box filled">4</div><div class="otp-box filled">8</div><div class="otp-box filled">3</div><div class="otp-box filled">1</div><div class="otp-box">_</div><div class="otp-box">_</div></div>
<div class="ui-input active"><span>&#9993;</span>&nbsp;arjun@gmail.com</div>
<div class="ui-input active"><span>&#127874;</span>&nbsp;15 March 2006 &nbsp;(Age 20)</div>
<div class="ui-btn">&#10003; Create Account</div>`,
be:`<div class="panel-label be-l"><div class="dot-be"></div>BACKEND — Firebase Auth + Firestore</div>
<div class="be-step"><div class="be-num">1</div><div class="be-text"><b>Firebase Auth</b> sends OTP via MSG91/Twilio. Phone number verified against OTP.</div></div>
<div class="be-step"><div class="be-num">2</div><div class="be-text"><b>Age check:</b> DOB &lt; 18 triggers minor flow. Second OTP to parent phone required before account created.</div></div>
<div class="be-step"><div class="be-num">3</div><div class="be-text"><b>Firestore</b> document created: status UNVERIFIED, level 4 default, visible = false.</div></div>
<div class="code-block"><span class="k">player</span> = {<br>&nbsp;&nbsp;<span class="n">uid</span>: <span class="s">"p_8xK2J"</span>,<br>&nbsp;&nbsp;<span class="n">status</span>: <span class="s">"UNVERIFIED"</span>,<br>&nbsp;&nbsp;<span class="n">tier</span>: <span class="k">3</span>, <span class="n">level</span>: <span class="k">4</span>,<br>&nbsp;&nbsp;<span class="n">visible</span>: <span class="k">false</span><br>}</div>`,
flow:"Auth Token",data:[["Phone","OTP Verified"],["Status","UNVERIFIED"],["Level","4 — District"],["Visible to Scouts","No"],["Minor Flow","Triggered if <18"]]},

{label:"Role",title:"Role Selection",sub:"Primary Role · Sub-Role · Format · Score Weights Set",
fe:`<div class="panel-label fe-l"><div class="dot-fe"></div>FRONTEND — Role Picker</div>
<div style="font-size:.63rem;color:var(--muted);margin-bottom:7px;">Select your primary cricket role</div>
<div class="role-grid">
<div class="role-chip sel"><div class="em">&#127992;</div>Opener</div>
<div class="role-chip"><div class="em">&#9889;</div>Death Bowl</div>
<div class="role-chip"><div class="em">&#127780;</div>Spinner</div>
<div class="role-chip"><div class="em">&#129354;</div>All-rounder</div>
<div class="role-chip"><div class="em">&#129354;</div>WK-Batter</div>
<div class="role-chip"><div class="em">&#128247;</div>Pace Bowl</div>
</div>
<div class="ui-input active"><span>&#127939;</span>&nbsp;Powerplay Opener (Overs 1-6)</div>
<div class="ui-input"><span>&#127919;</span>&nbsp;Preferred Format: T20</div>`,
be:`<div class="panel-label be-l"><div class="dot-be"></div>BACKEND — Role Config Engine</div>
<div class="be-step"><div class="be-num">1</div><div class="be-text"><b>Role template loaded:</b> Powerplay Opener enables PP-SR field, disables death-overs field.</div></div>
<div class="be-step"><div class="be-num">2</div><div class="be-text"><b>Score weights set:</b> BPI weight 0.85, phase emphasis = PP + Middle. IPL benchmark 40.5.</div></div>
<div class="be-step"><div class="be-num">3</div><div class="be-text"><b>Onboarding state</b> persisted. Next screen renders role-specific stat fields only.</div></div>
<div class="code-block"><span class="k">roleConfig</span> = {<br>&nbsp;&nbsp;<span class="n">role</span>: <span class="s">"PP_OPENER"</span>,<br>&nbsp;&nbsp;<span class="n">bpiWeight</span>: <span class="k">0.85</span>,<br>&nbsp;&nbsp;<span class="n">phases</span>: [<span class="s">"PP"</span>,<span class="s">"MID"</span>],<br>&nbsp;&nbsp;<span class="n">bench</span>: <span class="k">40.5</span><br>}</div>`,
flow:"Role Config",data:[["Role","Powerplay Opener"],["Format","T20"],["BPI Weight","0.85x"],["Benchmark","BPI 40.5"],["Phases","PP + Middle"]]},

{label:"Stats",title:"Stats Entry (Phase-Split)",sub:"Role-Specific Form · Phase Breakdown · Range Validation",
fe:`<div class="panel-label fe-l"><div class="dot-fe"></div>FRONTEND — Dynamic Stats Form</div>
<div style="font-size:.6rem;color:var(--g);font-weight:700;margin-bottom:8px;">T20 Batting &mdash; Phase Breakdown</div>
<div class="phase-row"><div class="phase-name">Powerplay SR</div><div class="phase-bar"><div class="phase-fill" style="width:88%;background:#22C55E"></div></div><div class="phase-val">148</div></div>
<div class="phase-row"><div class="phase-name">Middle SR</div><div class="phase-bar"><div class="phase-fill" style="width:72%;background:#3B82F6"></div></div><div class="phase-val">121</div></div>
<div class="phase-row"><div class="phase-name">Death SR</div><div class="phase-bar"><div class="phase-fill" style="width:94%;background:#F59E0B"></div></div><div class="phase-val">158</div></div>
<div class="phase-row"><div class="phase-name">Overall Avg</div><div class="phase-bar"><div class="phase-fill" style="width:64%;background:#8B5CF6"></div></div><div class="phase-val">34</div></div>
<div style="font-size:.58rem;color:var(--muted);margin-top:3px;">28 matches &middot; 490 runs &middot; Highest: 87</div>`,
be:`<div class="panel-label be-l"><div class="dot-be"></div>BACKEND — Validation + BPI Pre-Calculation</div>
<div class="be-step"><div class="be-num">1</div><div class="be-text"><b>Range checks:</b> SR must be 0-300. Avg must be &le;200. Innings &le; matches. Blocked if invalid.</div></div>
<div class="be-step"><div class="be-num">2</div><div class="be-text"><b>Phase check:</b> Death SR must be &ge; overall SR or a warning flag is added for scouts to see.</div></div>

const STEPS=[...S,...S2];
let cur=0,busy=false;

function buildTL(){
  const t=document.getElementById('tl');
  STEPS.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='tl-step'+(i<cur?' done':i===cur?' active':'');
    d.innerHTML=`<div class="tl-dot">${i<cur?'&#10003;':(i+1)}</div><div class="tl-label">${s.label}</div>`;
    d.onclick=()=>jump(i);
    t.appendChild(d);
  });
}

function render(idx){
  const s=STEPS[idx];
  return `<div class="card-top"><div class="step-badge">STEP ${idx+1} / 10</div><div><div class="card-title">${s.title}</div><div class="card-subtitle">${s.sub}</div></div><div class="layer-badges"><div class="lbadge fe">FRONTEND</div><div class="lbadge be">BACKEND</div></div></div>
<div class="panels"><div class="fe-panel">${s.fe}</div><div class="flow-col"><div style="font-size:.42rem;color:var(--dim);margin-bottom:3px;">DATA</div><div style="display:flex;flex-direction:column;gap:3px;"><div class="flow-dot"></div><div class="flow-dot"></div><div class="flow-dot"></div><div class="flow-dot"></div></div><div class="flow-lbl">${s.flow}</div><div style="display:flex;flex-direction:column;gap:3px;transform:scaleY(-1)"><div class="flow-dot" style="background:#60A5FA"></div><div class="flow-dot" style="background:#60A5FA"></div></div><div style="font-size:.42rem;color:var(--dim);margin-top:3px;">ACK</div></div><div class="be-panel">${s.be}</div></div>
<div class="data-row">${s.data.map(([k,v])=>`<div class="data-chip"><div class="data-key">${k}</div><div class="data-val">${v}</div></div>`).join('')}</div>`;
}

function updateUI(){
  document.querySelectorAll('.tl-step').forEach((e,i)=>{e.className='tl-step'+(i<cur?' done':i===cur?' active':'');});
  document.getElementById('cnum').textContent=cur+1;
  document.getElementById('pbar').style.width=((cur+1)/STEPS.length*100)+'%';
  document.getElementById('pb').style.opacity=cur===0?'.3':'1';
  document.getElementById('nb').innerHTML=cur===STEPS.length-1?'&#10003;':'&#8594;';
}

function go(dir){
  if(busy)return;
  const n=cur+dir;
  if(n<0||n>=STEPS.length)return;
  busy=true;
  const c=document.getElementById('wfc');
  c.classList.add('leaving');
  setTimeout(()=>{cur=n;c.innerHTML=render(cur);c.classList.remove('leaving');c.classList.add('entering');updateUI();setTimeout(()=>{c.classList.remove('entering');busy=false;},480);},360);
}

function jump(i){if(i===cur||busy)return;const d=i>cur?1:-1;cur=i-d;go(d);}

const cw=document.getElementById('cw');
document.getElementById('stage').addEventListener('mousemove',e=>{
  const r=cw.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  cw.style.transform=`rotateY(${(e.clientX-cx)/r.width*10}deg) rotateX(${-(e.clientY-cy)/r.height*6}deg)`;
});
document.getElementById('stage').addEventListener('mouseleave',()=>{cw.style.transform='';});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')go(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(-1);});

buildTL();
document.getElementById('wfc').innerHTML=render(0);
document.getElementById('pb').style.opacity='.3';
</script></body></html>
