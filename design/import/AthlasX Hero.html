<!DOCTYPE html>
<!--
  ============================================================================
  AthlasX — Hero Collage  ·  GOLDEN RATIO LAYOUT MATH
  ============================================================================
  φ (phi) = 1.618033...      1/φ = 0.618      1/φ² = 0.382      φ² = 2.618

  The mosaic is a 4-column × 3-row CSS grid whose track sizes are pure
  golden-ratio terms (expressed as `fr` so it stays fluid at any viewport):

      columns:  1.618fr  1.000fr  1.000fr  0.618fr      (Σ = 4.236)
      rows:     1.000fr  1.618fr  1.000fr               (Σ = 3.618)

  Resolved column widths (% of collage width):
      c1 = 1.618 / 4.236 = 38.20%      ← dominant left column (φ-major)
      c2 = 1.000 / 4.236 = 23.61%
      c3 = 1.000 / 4.236 = 23.61%
      c4 = 0.618 / 4.236 = 14.59%      ← φ-minor trailing column

  Resolved row heights (% of collage height):
      r1 = 1.000 / 3.618 = 27.64%
      r2 = 1.618 / 3.618 = 44.72%      ← φ-major middle band
      r3 = 1.000 / 3.618 = 27.64%

  Worked panel dimensions on a 1440 × 900 viewport (W=1440, H=900):
      P1 motorsport  c1 · (r1+r2)  →  550px × 651px   (650.9 ≈ 550·φ ✓ golden frame)
      P2 badminton   c2 · r1       →  340px × 249px
      P3 cricket     (c3+c4) · r1  →  550px × 249px   (wide φ-banner)
      P4 tennis      c2 · (r2+r3)  →  340px × 651px
      P5 volleyball  c3 · (r2+r3)  →  340px × 651px
      P6 athletics   c1 · r3       →  550px × 249px
      P7 tennis-2    c4 · (r2+r3)  →  210px × 651px   (φ-minor spire, ~651/210 ≈ φ²)

  The dominant P1 frame (550 × 651) is itself a golden rectangle: 550 × 1.618 ≈ 890,
  and its lit-to-dark vignette focal point sits at the 0.618 optical-center mark.

  AUTH CARD ANCHOR (also golden):  inset from the viewport edges by 2.618rem (= φ²rem),
  pinned bottom-right so its negative space mirrors the φ-minor P7 spire above it.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AthlasX — Every sport. Every talent. One platform.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* ----------------------------------------------------------------------
     PALETTE & TOKENS  — every colour lives here as a custom property
     ----------------------------------------------------------------------
     ACCENT CHOICE — electric saffron-amber (#FF8A1E).
     Why amber and not a team colour: greens read "cricket pitch", blues read
     "football / many national kits", reds skew "boxing". Amber/saffron is
     sport-neutral, reads as raw floodlit ENERGY against near-black, harmonises
     with the warm tones already in the collage (Kohli's flames, the volleyball
     ochre, Chopra's tricolour) AND nods to Indian grassroots heritage without
     claiming any single discipline. It is the one hue that unifies all six. */
  :root {
    --bg:            #0D0D0D;
    --bg-soft:       #141312;
    --text:          #F5F5F0;
    --text-dim:      rgba(245, 245, 240, 0.62);
    --accent:        #FF8A1E;
    --accent-rgb:    255, 138, 30;
    --accent-bright: #FFA64D;

    /* panel overlays — opacity variants of the accent */
    --overlay-accent-08: rgba(var(--accent-rgb), 0.08);
    --overlay-accent-14: rgba(var(--accent-rgb), 0.14);
    --overlay-accent-22: rgba(var(--accent-rgb), 0.22);

    /* structural */
    --seam:          rgba(13, 13, 13, 0.9);
    --gap:           3px;
    --phi:           1.618;
    --phi2:          2.618rem;          /* φ² rem — the auth-card anchor inset */
    --card-bg:       rgba(13, 13, 13, 0.55);
    --card-border:   rgba(245, 245, 240, 0.14);
    --field-bg:      rgba(245, 245, 240, 0.06);
    --ease:          cubic-bezier(0.22, 1, 0.36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Barlow", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 100vw;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: var(--bg);
  }

  /* ---------------------------------------------------------------- COLLAGE */
  .collage {
    position: absolute;
    inset: 0;
    display: grid;
    gap: var(--gap);
    background: var(--seam);
    grid-template-columns: 1.618fr 1fr 1fr 0.618fr;   /* φ-derived tracks */
    grid-template-rows:    1fr 1.618fr 1fr;
    grid-template-areas:
      "p1 p2 p3 p3"
      "p1 p4 p5 p7"
      "p6 p4 p5 p7";
  }

  .panel {
    position: relative;
    overflow: hidden;
    background: var(--bg-soft);
  }
  .panel img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: var(--focus, 50% 38%);
    display: block;
    transform: scale(1.06);
    transition: transform 1.1s var(--ease), filter 0.6s var(--ease);
    will-change: transform;
  }
  .stage.is-ready .panel img { transform: scale(1.001); }
  .panel:hover img { transform: scale(1.05); }

  /* per-panel accent wash + a hairline of accent on one diagonal edge */
  .panel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--overlay-accent-08);
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  /* grid placement + EDITORIAL FILTER PROFILE (each sport graded differently) */
  .p1 { grid-area: p1; }
  .p1 img { filter: saturate(1.05) contrast(1.04) brightness(0.96); }            /* motorsport — cool, cinematic */
  .p2 { grid-area: p2; }
  .p2 img { filter: saturate(1.2) contrast(1.05) brightness(1.02) hue-rotate(-4deg); } /* badminton — warmer */
  .p3 { grid-area: p3; }
  .p3 img { filter: saturate(1.18) contrast(1.12) brightness(0.98); --focus: 50% 30%; } /* cricket — high contrast */
  .p4 { grid-area: p4; }
  .p4 img { filter: saturate(1.1) contrast(1.06) brightness(0.99); --focus: 50% 22%; }  /* tennis (cubist) */
  .p5 { grid-area: p5; }
  .p5 img { filter: saturate(1.24) contrast(1.05) brightness(1.0); --focus: 46% 30%; }  /* volleyball — punchy warm */
  .p6 { grid-area: p6; }
  .p6 { background: #0d0d0d; }
  .p6 img { filter: saturate(1.1) contrast(1.04) brightness(1.0); --focus: 50% 42%; } /* cricket sketch-art (landscape) — shown as-is */
  .p7 { grid-area: p7; }
  .p7 img { filter: saturate(1.06) contrast(1.1) brightness(0.94); --focus: 50% 30%; }  /* tennis (sunburst) — moodier */

  /* subtle kinetic skew: two panels carry an angled inner edge (clip-path).
     Kept shallow (≈2.6°) so it energises the seams without looking gimmicky. */
  .p3 { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 92%); }
  .p6 { clip-path: polygon(0 8%, 100% 0, 100% 100%, 0 100%); }

  /* ------------------------------------------------- GLOBAL DARK VIGNETTE */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background:
      radial-gradient(115% 95% at 50% 46%,
        rgba(13,13,13,0.0)   0%,
        rgba(13,13,13,0.12) 38%,
        rgba(13,13,13,0.52) 72%,
        rgba(13,13,13,0.86) 100%),
      linear-gradient(to bottom,
        rgba(13,13,13,0.55) 0%,
        rgba(13,13,13,0.0) 24%,
        rgba(13,13,13,0.0) 62%,
        rgba(13,13,13,0.72) 100%);
  }

  /* ------------------------------------------------------- BRAND OVERLAY */
  .brand {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vmin;
    pointer-events: none;
  }
  .brand .eyebrow {
    font-family: "Barlow Semi Condensed", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.42em;
    font-weight: 600;
    font-size: clamp(10px, 1.05vw, 14px);
    color: var(--accent-bright);
    margin: 0 0 0.9rem 0;
    padding-left: 0.42em;
  }
  .brand .logotype {
    font-family: "Anton", "Barlow Semi Condensed", sans-serif;
    text-transform: uppercase;
    font-weight: 400;
    line-height: 0.84;
    letter-spacing: -0.01em;
    font-size: clamp(64px, 17vw, 320px);
    margin: 0;
    color: var(--text);
    text-shadow: 0 0.06em 0.5em rgba(0,0,0,0.55);
  }
  .brand .logotype .x {
    color: var(--accent);
    -webkit-text-stroke: 0;
  }
  .brand .tagline {
    font-family: "Barlow", sans-serif;
    font-weight: 500;
    font-size: clamp(15px, 2.1vw, 30px);
    letter-spacing: 0.02em;
    margin: 1.4rem 0 0 0;
    color: var(--text);
  }
  .brand .tagline b { color: var(--accent-bright); font-weight: 700; }
  .brand .rule {
    width: clamp(120px, 18vw, 260px);
    height: 2px;
    margin: 1.8rem auto 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  /* --------------------------------------------------------- AUTH CARD */
  /* persistent (NOT a modal) — pinned bottom-right, inset by φ²rem on each edge */
  /* compact account bar — pinned top-right, φ²rem inset to mirror the brandmark */
  .auth {
    position: absolute;
    top: 1.4rem;
    right: var(--phi2);
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem;
    background: rgba(13, 13, 13, 0.42);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 12px 34px -14px rgba(0,0,0,0.6);
  }
  .auth .btn { flex: 0 0 auto; padding: 0.52rem 1.1rem; white-space: nowrap; }
  .auth .auth-kicker {
    font-family: "Barlow Semi Condensed", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-bright);
    margin: 0 0 0.4rem 0;
  }
  .auth h2 {
    font-family: "Barlow", sans-serif;
    font-weight: 700;
    font-size: 1.0rem;
    line-height: 1.18;
    margin: 0 0 0.18rem 0;
    color: var(--text);
  }
  .auth p.sub {
    margin: 0 0 0.85rem 0;
    font-size: 0.78rem;
    line-height: 1.4;
    color: var(--text-dim);
  }
  .field {
    position: relative;
    margin-bottom: 0.85rem;
  }
  .field input {
    width: 100%;
    padding: 0.62rem 0.85rem;
    font-family: "Barlow", sans-serif;
    font-size: 0.88rem;
    color: var(--text);
    background: var(--field-bg);
    border: 1px solid var(--card-border);
    border-radius: 9px;
    outline: none;
    transition: border-color 0.25s var(--ease), background 0.25s var(--ease), box-shadow 0.25s var(--ease);
  }
  .field input::placeholder { color: rgba(245,245,240,0.4); }
  .field input:focus {
    border-color: var(--accent);
    background: rgba(245,245,240,0.09);
    box-shadow: 0 0 0 3px var(--overlay-accent-22);
  }
  .field input.invalid {
    border-color: #ff5a4d;
    box-shadow: 0 0 0 3px rgba(255,90,77,0.18);
  }
  .field .msg {
    font-size: 0.74rem;
    color: #ff8a7e;
    margin: 0.4rem 0 0 0.15rem;
    min-height: 0.5rem;
    opacity: 0;
    transition: opacity 0.2s var(--ease);
  }
  .field .msg.show { opacity: 1; }
  .field .msg.ok { color: var(--accent-bright); }

  .actions {
    display: flex;
    gap: 0.6rem;
    margin-top: 0.2rem;
  }
  .btn {
    flex: 1;
    padding: 0.6rem 0.5rem;
    font-family: "Barlow Semi Condensed", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    font-size: 0.84rem;
    border-radius: 9px;
    cursor: pointer;
    transition: transform 0.18s var(--ease), background 0.22s var(--ease), border-color 0.22s var(--ease), color 0.22s var(--ease), box-shadow 0.22s var(--ease);
  }
  .btn:active { transform: translateY(1px); }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--card-border);
  }
  .btn-outline:hover {
    border-color: var(--text);
    background: rgba(245,245,240,0.06);
  }
  .btn-fill {
    background: var(--accent);
    color: #1a0e02;
    border: 1.5px solid var(--accent);
    box-shadow: 0 8px 22px -8px rgba(var(--accent-rgb), 0.7);
  }
  .btn-fill:hover {
    background: var(--accent-bright);
    border-color: var(--accent-bright);
    box-shadow: 0 10px 26px -8px rgba(var(--accent-rgb), 0.85);
  }
  .auth .legal {
    margin: 0.8rem 0 0 0;
    font-size: 0.68rem;
    line-height: 1.4;
    color: var(--text-dim);
  }
  .auth .legal a { color: var(--accent-bright); text-decoration: none; }
  .auth .legal a:hover { text-decoration: underline; }

  /* corner brandmark, top-left */
  .corner {
    position: absolute;
    top: var(--phi2);
    left: var(--phi2);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    pointer-events: none;
  }
  .corner .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px 1px rgba(var(--accent-rgb), 0.8);
  }
  .corner .mark {
    font-family: "Barlow Semi Condensed", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--text);
  }
  .corner .mark span { color: var(--accent); }

  /* ============================ RESPONSIVE — down to 375px ============== */
  @media (max-width: 860px) {
    .auth { width: clamp(280px, 42vw, 360px); }
    .brand .logotype { font-size: clamp(56px, 20vw, 200px); }
  }

  @media (max-width: 640px) {
    .stage { min-height: 100dvh; }
    /* collapse to a 3-panel vertical stack */
    .collage {
      position: absolute;
      inset: 0;
      grid-template-columns: 1fr;
      grid-template-rows: 1.618fr 1fr 1fr;     /* φ-led top panel */
      grid-template-areas:
        "p1"
        "p3"
        "p4";
    }
    .p2, .p5, .p6, .p7 { display: none; }      /* keep 3 hero sports */
    .p3 { clip-path: none; }                    /* drop skew on stack */
    .p6 { clip-path: none; }

    .brand { justify-content: flex-start; padding-top: 16vh; }
    .brand .logotype { font-size: clamp(64px, 22vw, 130px); }
    .brand .tagline { font-size: clamp(14px, 4.4vw, 20px); }

    .corner { top: 1.4rem; left: 1.4rem; }

    /* account bar stays a compact top-right cluster */
    .auth {
      top: 1.3rem;
      right: 1.3rem;
      left: auto;
      bottom: auto;
    }
    .auth .btn { padding: 0.5rem 0.9rem; font-size: 0.8rem; }
  }

  @media (max-width: 380px) {
    .brand .logotype { font-size: clamp(54px, 24vw, 96px); }
    .auth { padding: 1.2rem 1.15rem calc(1.25rem + env(safe-area-inset-bottom, 0px)); }
  }

  /* ----------------------------- prefers-reduced-motion ----------------- */
  @media (prefers-reduced-motion: reduce) {
    .panel img {
      transition: none !important;
      transform: none !important;
    }
    .stage.is-ready .panel img { transform: none !important; }
    .panel:hover img { transform: none !important; }
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <main class="stage" id="stage" aria-label="AthlasX — multi-sport talent discovery">

    <!-- COLLAGE: panels are populated from ATHLASX_IMAGES by data-sport key -->
    <section class="collage" id="collage" aria-hidden="true">
      <figure class="panel p1" data-sport="motorsport"></figure>
      <figure class="panel p2" data-sport="badminton"></figure>
      <figure class="panel p3" data-sport="cricket"></figure>
      <figure class="panel p4" data-sport="tennis"></figure>
      <figure class="panel p5" data-sport="volleyball"></figure>
      <figure class="panel p6" data-sport="cricket-wide"></figure>
      <figure class="panel p7" data-sport="tennis-2"></figure>
    </section>

    <div class="vignette"></div>

    <div class="corner">
      <span class="mark">Athlas<span>X</span></span>
    </div>

    <!-- BRAND OVERLAY -->
    <header class="brand">
      <p class="eyebrow">Grassroots to Global · District · State · Beyond</p>
      <h1 class="logotype">ATHLAS<span class="x">X</span></h1>
      <p class="tagline">Every sport. Every talent. <b>One platform.</b></p>
      <div class="rule"></div>
    </header>

    <!-- ACCOUNT BAR — persistent, golden-anchored top-right -->
    <nav class="auth" id="auth" aria-label="Account">
      <button type="button" class="btn btn-outline" id="logIn">Log In</button>
      <button type="button" class="btn btn-fill" id="signIn">Sign In</button>
    </nav>
  </main>

<script>
// ── ATHLASX_IMAGES ─ swap any `url` to drop in real artwork; layout is untouched.
//    Each entry: { sport, url, alt }. picsum.photos fallbacks are listed inline
//    so the collage renders even before production assets are wired in.
const ATHLASX_IMAGES = [
  { sport: "motorsport", url: "assets/motorsport.jpg",      /* fallback: https://picsum.photos/seed/athlasx-motor/800/1300  */ alt: "Motorsport driver standing on a single-seater race car under a vast cloud-streaked sky" },
  { sport: "badminton",  url: "assets/badminton.jpg",       /* fallback: https://picsum.photos/seed/athlasx-bad/700/900     */ alt: "Badminton player roaring in triumph with racket raised, national flag behind" },
  { sport: "cricket",    url: "assets/cricket.jpg",         /* fallback: https://picsum.photos/seed/athlasx-cric/1100/700   */ alt: "Cricketer in national kit, number 18, looking out over a smoke-coloured sky" },
  { sport: "tennis",     url: "assets/tennis.jpg",          /* fallback: https://picsum.photos/seed/athlasx-ten/700/1100   */ alt: "Cubist-style tennis player mid-roar gripping a racket" },
  { sport: "volleyball", url: "assets/volleyball.jpg",      /* fallback: https://picsum.photos/seed/athlasx-vol/700/1200   */ alt: "Volleyball player leaping to serve against a splash of blue and gold paint" },
  { sport: "cricket-wide", url: "assets/cricket-sketch-wide.png", /* fallback: https://picsum.photos/seed/athlasx-cric4/720/405 */ alt: "Sketch-and-paint landscape composite of a cricketer in national blue" },
  { sport: "tennis-2",   url: "assets/tennis-sunburst.jpg", /* fallback: https://picsum.photos/seed/athlasx-ten2/600/1100  */ alt: "Stylised tennis player against a radiating sunburst of warm colour" }
];

(function () {
  "use strict";

  /* 1 ── paint the collage from config (data-sport → panel) */
  const byKey = Object.create(null);
  ATHLASX_IMAGES.forEach(function (e) { byKey[e.sport] = e; });

  const panels = document.querySelectorAll(".panel[data-sport]");
  let pending = 0;
  panels.forEach(function (panel) {
    const cfg = byKey[panel.getAttribute("data-sport")];
    if (!cfg) return;
    const img = new Image();
    img.alt = cfg.alt || "";
    img.decoding = "async";
    img.loading = "eager";
    pending++;
    const done = function () {
      if (--pending <= 0) document.getElementById("stage").classList.add("is-ready");
    };
    img.addEventListener("load", done);
    img.addEventListener("error", function () {
      // graceful fallback: tinted placeholder block so layout never breaks
      panel.style.background =
        "linear-gradient(135deg, rgba(var(--accent-rgb),0.22), rgba(13,13,13,0.9))";
      done();
    });
    img.src = cfg.url;
    panel.appendChild(img);
  });
  // safety: reveal even if some images stall
  setTimeout(function () { document.getElementById("stage").classList.add("is-ready"); }, 2200);

  /* 2 ── account bar behaviour (no framework — simple demo state) */
  const logIn  = document.getElementById("logIn");
  const signIn = document.getElementById("signIn");

  function pulse(btn) {
    if (btn.disabled) return;
    const original = btn.textContent;
    btn.disabled = true;
    btn.style.opacity = "0.75";
    btn.textContent = "…";
    setTimeout(function () {
      btn.disabled = false;
      btn.style.opacity = "";
      btn.textContent = original;
    }, 900);
  }

  logIn.addEventListener("click", function () { window.location.href = "AthlasX Auth.html"; });
  signIn.addEventListener("click", function () { window.location.href = "AthlasX Auth.html"; });
})();
</script>
</body>
</html>
